# ===================================================================
# QA Data Analysis Agent — Render Deployment Configuration
# ===================================================================
# Single Web Service with Docker
# 
# Architecture:
#   One Docker container running:
#   - Nginx (port 80) → public entry point
#   - React SPA (static files served by Nginx)
#   - FastAPI (internal port 8000) → proxied via Nginx /api/*
# 
# Environment Variables (set in Render Dashboard):
# - GROQ_API_KEY: Your Groq API key
# - DATABASE_URL: Neon PostgreSQL connection string
# - JWT_SECRET_KEY: Generated secret (python -c "import secrets; print(secrets.token_urlsafe(32))")
# - GROQ_MODEL: (optional) LLM model to use
# - ALLOWED_ORIGINS: (optional) Comma-separated list of allowed origins (same-origin in production)
# - ENABLE_OPENAPI_DOCS: (optional) Enable/disable Swagger/Redoc
# ===================================================================

services:
  # Single Combined Service
  - type: web
    name: qa-data-analysis-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOWED_ORIGINS
        value: ""  # Same-origin in production, empty allows all (configure as needed)
      - key: ENABLE_OPENAPI_DOCS
        value: "true"
    healthCheckPath: /health
    autoDeploy: true
    plan: starter

# Databases: Using Neon PostgreSQL (external)
# No database configuration needed here - uses Neon via DATABASE_URL
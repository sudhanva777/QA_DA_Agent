# ===================================================================
# QA Data Analysis Agent — Render Deployment Configuration
# ===================================================================
# This file configures deployment to Render.com
# 
# Render Services:
# 1. Backend: Web Service (Docker)
# 2. Frontend: Static Site (or Web Service with Docker)
# 
# Environment Variables (set in Render Dashboard):
# - GROQ_API_KEY: Your Groq API key
# - DATABASE_URL: Neon PostgreSQL connection string
# - JWT_SECRET_KEY: Generated secret (python -c "import secrets; print(secrets.token_urlsafe(32))")
# - GROQ_MODEL: (optional) LLM model to use
# - ALLOWED_ORIGINS: (optional) Comma-separated list of allowed origins
# - ENABLE_OPENAPI_DOCS: (optional) Enable/disable Swagger/Redoc
# ===================================================================

services:
  # Backend API Service
  - type: web
    name: qa-data-analysis-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.onrender.com
      - key: ENABLE_OPENAPI_DOCS
        value: "true"
    healthCheckPath: /health
    autoDeploy: true
    plan: starter

  # Frontend Static Site (alternative: deploy as Web Service with Docker)
  - type: web
    name: qa-data-analysis-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://qa-data-analysis-api.onrender.com
    healthCheckPath: /
    autoDeploy: true
    plan: starter

# Databases: Using Neon PostgreSQL (external)
# No database configuration needed here - uses Neon via DATABASE_URL
# ===================================================================
# QA Data Analysis Agent — Docker Compose
# ===================================================================
# Two-service architecture:
#   backend  — FastAPI + Uvicorn (port 8000)
#   frontend — React SPA + Nginx reverse proxy (port 3000)
# ===================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-da-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Allow frontend container origin for CORS
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost:5174
    volumes:
      # Persist uploaded datasets across container restarts
      - qa_data:/app/data
      # Persist logs and cache
      - qa_logs:/app/logs
      # Persist generated charts
      - qa_outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qa-da-agent-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  qa_data:
    driver: local
  qa_logs:
    driver: local
  qa_outputs:
    driver: local
